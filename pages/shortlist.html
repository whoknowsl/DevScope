<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHORTLIST</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <script type="module" src="./js/shortlist.js"></script>
  </head>
  <body class="min-h-screen bg-[#010309] text-[#e6edf3] font-sans">
    <header
      class="bg-[#161b22] px-3 py-3 flex justify-between items-center border-b-1 border-b-gray-500 sticky top-0"
    >
      <div class="logo flex items-center gap-3">
        <img
          class="h-10 w-10 fill-white rounded-md"
          src="/imges/logo.png"
          alt="logo"
        />
        <h1 class="text-xl font-semibold">DevScope</h1>
      </div>
      <nav
        aria-label="Navigation principale"
        class="flex items-center gap-2 text-sm"
      >
        <a
          href="/index.html"
          aria-current="page"
          class="rounded-md border border-[#30363d] bg-[#21262d] px-3 py-1.5 font-medium hover:bg-[#30363d]"
        >
          Recherche
        </a>
        <a
          href="/pages/shortlist.html"
          class="rounded-md border border-[#30363d] px-3 py-1.5 font-medium text-[#e6edf3] hover:bg-[#21262d]"
        >
          Shortlist
        </a>
      </nav>
    </header>
    <main class="min-h-screen px-4 py-3">
      <div>
        <h1 class="text-[#58a6ff] my-3 text-4xl">Ma shortist</h1>
        <p class="text-[#7d8590] text-2xl">
          3 candidat (s) dans votre shortist
        </p>
      </div>
      <div
        class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mt-4"
      >
        <div
          role="group"
          aria-label="Filtrer par statut"
          class="flex flex-wrap items-center gap-1 rounded-full border border-white/10 bg-white/5 p-1"
        >
          <button
            type="button"
            data-status="tous"
            class="bg-[#7d8590] rounded-full px-5 py-2 font-mono text-sm font-bold text-white"
          >
            Tous
          </button>
          <button
            type="button"
            data-status="a-contacter"
            class="rounded-full px-4 py-2 font-mono text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            À contacter
          </button>
          <button
            type="button"
            data-status="entretien"
            class="rounded-full px-4 py-2 font-mono text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            Entretien
          </button>
          <button
            type="button"
            data-status="retenu"
            class="rounded-full px-4 py-2 font-mono text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            Retenu
          </button>
          <button
            type="button"
            data-status="refuse"
            class="rounded-full px-4 py-2 font-mono text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"
          >
            Refusé
          </button>
        </div>
        <div>
          <label for="searchCandidate" class="sr-only"
            >Rechercher un candidat</label
          >
          <input
            id="searchCandidate"
            type="text"
            placeholder="Rechercher un candidat…"
            class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-slate-200 placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/40 sm:w-80"
          />
        </div>
      </div>
      <div class="short-list mt-3 flex flex-col gap-4">
        <div
          class="flex bg-[#161b22]  px-3 py-4 border-1 rounded-l">
          <div class="">
            <div class="" flex justify-between>
              <img class="w-30 rounded-full" src="${user.avatar_url}" />
              <div>
                <h1>${user.login}</h1>
                <p>@${user.name}</p>
                <span>Java</span>
                <p>${user.bio}</p>
                <p>Ajoute le ${user.created_at}</p>
                <p></p>
              </div>
            </div>
            <div class="flex gap-4">
              <span>stars</span>
              <button>Refuse</button>
              <button>Modifier</button>
              <button>Supprimer</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer
      class="border-t border-[#30363d] py-6 text-center text-xs text-[#7d8590]"
    >
      DevScope · projet by whoknows
    </footer>
  </body>
</html>
