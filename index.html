<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevScope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
    <script type="module" src="script.js"></script>
  </head>
  <body class=" min-h-screen bg-[#010309] text-[#e6edf3] font-sans">
    <header
      class="bg-[#161b22] px-3 py-3 flex justify-between items-center border-b-1 border-b-gray-500"
    >
      <div class="logo flex items-center gap-3">
        <img class="h-10 w-10 fill-white rounded-md" src="imges/logo.png" alt="logo" />
        <h1  class="text-xl font-semibold">DevScope</h1>
      </div>
      <nav aria-label="Navigation principale" class="flex items-center gap-2 text-sm">
          <a
            href="/pages/recherche.html"
            aria-current="page"
            class="rounded-md border border-[#30363d] bg-[#21262d] px-3 py-1.5 font-medium hover:bg-[#30363d]"
          >
            Recherche
          </a>
          <a
            href="/pages/shortlist.html"
            class="rounded-md border border-[#30363d] px-3 py-1.5 font-medium text-[#e6edf3] hover:bg-[#21262d]"
          >
            Shortlist
          </a>
        </nav>
    </header>
    <main class="min-h-screen mx-auto max-w-3xl px-4 py-16 text-center sm:py-24 ">
      <h1 class="text-4xl font-semibold leading-tight sm:text-5xl">  <h1 class="text-4xl font-semibold leading-tight sm:text-5xl">
        Trouvez les meilleurs développeurs grâce à
        <span class="text-[#58a6ff]">leur code</span></h1>
       <p class="mx-auto mt-5 max-w-xl text-lg text-[#7d8590]">
        Analysez un <span class="text-[#58a6ff]">profil</span>, ses
        <span class="text-[#d29922]">projets</span> et ses
        <span class="text-[#3fb950]">langages</span> en quelques secondes.
      </p>
      <form id="recherch-form" class="mt-4">
           <label for="username" class="sr-only">Nom d'utilisateur GitHub</label>
        <div class="flex flex-col gap-3 sm:flex-row">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 fill-[#7d8590]"></i>
            <input
              id="user-name"
              type="text"
              autocomplete="off"
              placeholder="Entrez un nom d'utilisateur…"
              class="w-full rounded-md border border-[#30363d] bg-[#0d1117] py-2.5 pl-10 pr-3 text-base text-[#e6edf3] placeholder:text-[#7d8590] focus:border-[#58a6ff] focus:outline-none focus:ring-2 focus:ring-[#1f6feb]/50"
            />
          </div>
          <button
            type="submit"
            class="rounded-md border border-[#2ea043] bg-[#238636] px-5 py-2.5 font-semibold text-white hover:bg-[#2ea043] focus:outline-none focus:ring-2 focus:ring-[#3fb950]/50"
          >
            Analyser
          </button>
        </div>
        <p id="errorUsername" class="mt-2 min-h-5 text-left text-sm text-[#f85149]"></p>
      </form>
    </main>
      <footer class="border-t border-[#30363d] py-6 text-center text-xs text-[#7d8590]">
      DevScope · projet by whoknows
    </footer>
  </body>
</html>
